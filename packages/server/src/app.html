<!doctype html>
<html lang="en" data-theme="observatory">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="icon" href="/favicon.svg" />
        <script>
            try {
                var theme = localStorage.getItem("counterscale-theme");
                if (theme === "signal" || theme === "observatory") {
                    document.documentElement.dataset.theme = theme;
                    document.documentElement.style.colorScheme = theme === "signal" ? "dark" : "light";
                }
            } catch (error) {}
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
        <script id="counterscale-script" data-site-id="pulse" src="/tracker.js?v=3.5.0" defer></script>
    </body>
</html>
